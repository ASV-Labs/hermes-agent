title: helm
description: "A redesigned Hermes Desktop. A Desk home page (greeting and crew status, a prompt that hands work to any bot, Continue, Needs you, Today's scheduled jobs); pending tool approvals and questions from every bot's live chats answered in one place, on the Desk and in a sidebar pane, only on your click; a Bots board tab (Board, Roster, Routines, Agent inbox) with a Bot view (profile, routines with on/off switches, permissions, the bot's computer, voice) and a bot editor (description, skills, model, SOUL.md); a chat header and in-chat side panel with the focused chat's live task plan, Steer and Stop, and All / Needs you / Working / Done pills at the top of each bot's session group; a themeable redesign layer across the app (three bases, seven accents, type, corners, density, rail, layout presets) on a Customize look page; status in the titlebar, session rows and status bar; a HUD board in Hermes's HUD window; and animated robots (191 Blender-rendered PNG layers as petdex/Codex sprite sheets) that become each bot's Hermes avatar and Hermes pet. Disclosure — desktop half uses Desktop SDK areas, host verbs and public gateway calls the app itself makes (per-bot reads through host.requestProfile). Reads: host.profiles.list and host.listPersistedSessions (held in memory), session.active_list, approval.pending, session.history (the focused chat's plan), cron.manage action list, config.get (approvals.mode; per bot terminal.backend, tts.provider and voice, bot_desktop.placement), mcp.servers.status, profiles.describe (only while the bot editor is open), display.status and a display.thumbnail every 2.5 s (only while the Bot view's Computer tab is open), profiles.get_asset once a minute, pet.gallery once per look; host.onEvent for approval/clarify/todo/tool/handoff/message.complete events (the last reply's text, 1 200 chars, kept in ctx.storage for the HUD's Latest from). Only on your click: approval.respond and clarify.respond (Approve, Allow session, Deny, Send); session.interrupt (Stop); config.set approvals.mode from the composer's approval pill, including off (\"Act without asking\" turns tool approvals off for that window, as Hermes's own status-bar control does); cron.manage pause/resume from a routine's switch (never adds or removes a job); profiles.create from New bot and Duplicate; profiles.configure from the bot editor's Save (description, disabled skills, model and provider, SOUL.md; an expensive model asks again); display.start from the Computer tab; host.restartGateway from the flat-robots notice; a chat message from the Desk prompt on Enter or Send; ctx.runAction composer.focus and conversation.scrollPageUp. With \"Robots as Hermes avatars\" on (the default) it sets a robot with profiles.set_asset on any bot with no avatar or with Bot Mode's 160 px face and leaves other images alone (an uploaded image exactly 160 or 256 px wide is mistaken for a generated one); with \"Robots as Hermes pets\" on (the default) the dashboard half's one write, POST /pets/install, saves pet.json and spritesheet.webp under <bot home>/pets/helm-<bot>/ and pet.select switches a bot with no active pet to it (a pet you chose is never replaced). HUD window only: the raw window.hermesDesktop bridge for hud.setBounds/close, screenshot.getSettings/onStatus (the See my screen state) and quickEntry.getSettings (the summon shortcut); nothing in the main window uses it. The theme layer is the SDK theme customCSS and selects the app's data-slot names in CSS only (validate warns on these selectors). Script draws only its own elements (SDK slots, its rail and HUD board) and sets data-helm-* attributes on the root element; it never selects, observes or edits the app's elements, apart from four measurement-only reads: the root's data-hermes-theme attribute (restores a helm theme another plugin switched away at launch), the composer frame and main zone header rects (placement), pointer-over the sessions zone (collapse under 1100 px), and a three-marker presence check that names what a Hermes update moved. Writes its own ctx.storage and, when changed in its settings, the app's sessionListDensity, chatTextScale and reasoning.collapsedByDefault. The dashboard half is a FastAPI router serving the bundled PNGs and sprite sheets (fixed-pattern names, no Hermes internals imported) plus the pet write above. The agent half registers nothing. No third-party network calls, no shell, no credentials, no telemetry, no self-updater. tools/render/ holds the Blender source that produced the PNGs (not run by Hermes)."
