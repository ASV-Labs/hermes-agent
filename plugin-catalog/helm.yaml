known_issues:
  - "The robot renders come from the plugin's dashboard half, which mounts when the gateway starts; until one Hermes restart after install the Bots board shows flat SVG robots."
  - "The theme layer's CSS targets data-slot names the app ships; if a Desktop release renames one, that rule stops applying and the palette alone remains."
  - "Verified by hand on macOS (Apple silicon). Linux and Windows run the same code but were not exercised."
